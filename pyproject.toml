[project]
name = "text-to-foley"
version = "0.1.0"
requires-python = ">=3.9"

dependencies = [
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "audiocraft>=1.3.0",
    "transformers>=4.30.0,<4.41.0",
    "soundfile>=0.12.0",
    "numpy<2,>=1.24.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
